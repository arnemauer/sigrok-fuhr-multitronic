name: tests

on:
  push:
  pull_request:

jobs:
  decoder:
    name: Replay captures through the decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the decoder against all captures
        run: python3 tests/test_pd.py
